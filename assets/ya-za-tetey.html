/* Layout: one narrow column — goal strip, pixel scene, the child's thought, two tabs. Single dark world on purpose. */
:root{
  --void:#171814; --paper:#ece6d3; --dim:#8d8a7a; --line:#3a3b33; --alarm:#d0503f;
  --pixel:'Press Start 2P','Courier New',monospace;
  --mono:'PT Mono','Courier New',monospace;
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--void);color:var(--paper);font-family:var(--mono)}
.app{width:100%;max-width:460px;margin:0 auto;box-sizing:border-box;min-height:100%;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px;
  display:flex;flex-direction:column;gap:12px}
.bar{display:flex;align-items:center;gap:12px;min-height:64px}
#card{width:40px;height:68px;image-rendering:pixelated;background:var(--paper);flex:none}
.goal{flex:1;min-width:0;font-family:var(--pixel);font-size:11px;line-height:1.7;letter-spacing:.04em}
.goal small{display:block;font-family:var(--mono);font-size:13px;color:var(--dim);letter-spacing:0;line-height:1.4}
.clock{font-family:var(--pixel);font-size:11px;color:var(--dim);font-variant-numeric:tabular-nums}
.stage{position:relative;width:100%;max-width:100%;aspect-ratio:160/150;flex:none;height:auto}
#scene{display:block;width:100%;height:100%;image-rendering:pixelated;cursor:pointer;touch-action:manipulation}
.thought{min-height:3em;font-size:17px;line-height:1.45;font-style:italic}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tab{font-family:var(--pixel);font-size:11px;letter-spacing:.04em;padding:16px 8px;background:transparent;color:var(--dim);border:2px solid var(--line);cursor:pointer}
.tab[aria-pressed="true"]{background:var(--paper);color:var(--void);border-color:var(--paper)}
.tab.warn{animation:warn .5s steps(2) infinite}
@keyframes warn{50%{border-color:var(--alarm);color:var(--alarm)}}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:16px;background:rgba(23,24,20,.86)}
.overlay.prize{justify-content:flex-end;gap:8px;padding-bottom:12px;background:linear-gradient(rgba(23,24,20,0) 64%,rgba(23,24,20,.92) 80%)}
.overlay.prize p{font-size:13px}
.overlay.prize .hint{font-size:12px}
.overlay.soft{justify-content:flex-start;background:linear-gradient(rgba(23,24,20,.9),rgba(23,24,20,.55) 55%,rgba(23,24,20,0))}
.overlay h1{font-family:var(--pixel);font-size:18px;line-height:1.5;margin:0;text-wrap:balance}
.overlay h1.big{font-size:34px}
.overlay p{margin:0;max-width:32ch;font-size:15px;line-height:1.5}
.overlay .hint{color:var(--dim);font-size:13px}
.btn{font-family:var(--pixel);font-size:12px;padding:14px 20px;background:var(--paper);color:var(--void);border:none;cursor:pointer}
.btn:focus-visible,.tab:focus-visible{outline:2px solid var(--alarm);outline-offset:2px}
.levels{display:grid;gap:8px;width:100%;max-width:330px}
.lvl{display:block;width:100%;text-align:left;background:var(--paper);color:var(--void);border:2px solid var(--paper);padding:10px 12px;cursor:pointer;font-family:var(--mono)}
.lvl b{display:block;font-family:var(--pixel);font-size:11px;letter-spacing:.04em;margin-bottom:5px}
.lvl span{display:block;font-size:13px;line-height:1.35}
.lvl.hard{background:transparent;color:var(--paper)}
.lvl:focus-visible{outline:2px solid var(--alarm);outline-offset:2px}
.lvl em{font-style:normal;color:#c98a2a}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.btn.ghost{background:transparent;color:var(--paper);border:2px solid var(--paper)}
.overlay{overflow-y:auto}
.app.inmenu .bar,.app.inmenu .thought,.app.inmenu .tabs,.app.inmenu .foot{display:none}
.app.inmenu{justify-content:center}
.overlay .copy{font-family:var(--pixel);font-size:8px;line-height:1;letter-spacing:.08em;color:#6e6858;margin:4px 0 0}
.overlay.menuov{background:rgba(20,19,15,.84);gap:16px}
.overlay.titleov{justify-content:flex-end;gap:8px;padding-block:10px 12px;background:linear-gradient(rgba(15,14,11,0) 75%,rgba(22,19,14,.9) 80%)}
.titleov .title{font-size:clamp(18px,7vw,30px);line-height:1.15;white-space:nowrap}
.titleov .tag{font-size:12px;color:var(--dim);margin:6px auto 0;max-width:none}
.overlay.menuov.top{justify-content:flex-start;padding-top:22px}
.title{font-family:var(--pixel);font-size:clamp(22px,7.6vw,32px);line-height:1.2;margin:0;color:var(--paper);text-shadow:3px 3px 0 #6a2e14;letter-spacing:.02em}
.title.sm{font-size:clamp(16px,5vw,20px);text-shadow:2px 2px 0 #6a2e14}
.tag{font-size:14px;line-height:1.5;color:var(--paper);max-width:30ch;margin:0}
.press{font-family:var(--pixel);font-size:11px;letter-spacing:.06em;color:#f2c84a;margin:0}
.blink{animation:blink 1.1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.menu{display:grid;gap:4px;width:100%;max-width:300px}
.mi{position:relative;font-family:var(--pixel);font-size:12px;letter-spacing:.06em;line-height:1.4;padding:11px 12px 11px 32px;text-align:left;background:transparent;color:var(--paper);border:none;cursor:pointer}
.mi::before{content:'';position:absolute;left:12px;top:14px;border-style:solid;border-width:5px 0 5px 8px;border-color:transparent transparent transparent #f2c84a;opacity:0}
.mi:hover::before,.mi:focus::before{opacity:1}
.mi:hover,.mi:focus{color:#f2c84a;outline:none}
.mi:focus-visible{background:rgba(242,200,74,.08)}
.mi small{display:block;font-family:var(--mono);font-size:12px;letter-spacing:0;color:var(--dim);margin-top:5px}
.mi em{font-style:normal;color:#f2c84a}
.rules{list-style:none;margin:0;padding:0;display:grid;gap:8px;max-width:34ch;text-align:left;font-size:13px;line-height:1.4}
.rules li{display:grid;grid-template-columns:30px 1fr;gap:12px;align-items:center}
.rules canvas{width:30px;height:51px;image-rendering:pixelated;background:#ece6d3}
.rules b{font-family:var(--pixel);font-size:10px;color:#f2c84a;display:block;margin-bottom:3px;letter-spacing:.04em}
.pausebtn{position:absolute;top:6px;right:6px;z-index:2;width:34px;height:34px;display:flex;align-items:center;justify-content:center;gap:5px;background:rgba(23,24,20,.55);border:2px solid rgba(236,230,211,.6);cursor:pointer;padding:0}
.pausebtn i{display:block;width:4px;height:14px;background:var(--paper)}
.pausebtn:focus-visible{outline:2px solid var(--alarm);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.blink{animation:none}}
.foot{color:var(--dim);font-size:12px;line-height:1.5;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between}
.mbtn{font-family:var(--mono);font-size:13px;color:var(--paper);background:transparent;border:1px solid var(--line);padding:6px 10px;cursor:pointer}
.mbtn[aria-pressed="false"]{color:var(--dim)}
.mbtn:focus-visible{outline:2px solid var(--alarm);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.tab.warn{animation:none;border-color:var(--alarm);color:var(--alarm)}}
</style>

<div class="app inmenu" id="app">
  <div class="bar">
    <canvas id="card" width="20" height="34" aria-hidden="true"></canvas>
    <div class="goal" id="goal">ТЫ ЗА ТЁТЕЙ<small>красное пальто, белая шапка, авоська</small></div>
    <div class="clock" id="clock">0:00</div>
  </div>
  <div class="stage">
    <button class="pausebtn" id="pause" type="button" aria-label="Пауза" hidden><i></i><i></i></button>
    <canvas id="scene" width="160" height="150" aria-label="Игровая сцена"></canvas>
    <div class="overlay" id="overlay"></div>
  </div>

const HATS=[null,'#e8e2cf','#2a2622','#4f6275','#8a5a2b'];

const PERMS=['#8a3a2a','#6a2a3a','#b5602c','#a88a6a','#7a3050'];
const SCARVES=['#b8423a','#4f6275','#c7c0b0','#7a5a8a','#c49a3a'];

function scandalK(){
  if(!st||!st.scandal)return 0;
  const t=st.scandal.t,D=st.scandal.dur;
  return clamp(Math.min(t/1.2,(D-t)/1));
}

const LV={
  1:{name:'Уровень 1',decay:.78,maxDec:2,shuf:1.35,gap:1.45,kids:-2},
  2:{name:'Уровень 2',decay:1,maxDec:3,shuf:1,gap:1,kids:0}
};
let L=LV[2];
const pick=a=>a[Math.floor(Math.random()*a.length)];
const lerp=(a,b,t)=>a+(b-a)*t;
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
// hs: 0 knitted hat, 1 headscarf, 2 ushanka, 3 flat cap, 4 tall fur hat. perm: curly «химия» when bare-headed
function npcLook(){
  const L={coat:pick(COATS),hat:pick(HATS),hs:Math.floor(Math.random()*5),hair:pick(HAIRS),bag:pick([0,1,2]),fur:Math.random()<.4?pick(FURS):null,perm:false};
  if(L.hs===1)L.hat=pick(SCARVES);
  if(L.hs===4&&L.hat)L.hat=pick(['#2a2622','#77796f','#c7c0b0','#8a5a2b']);
  if(!L.hat&&Math.random()<.6){L.perm=true;L.hair=pick(PERMS)}
  return L;
}
function babkaLook(){
  return {coat:pick(['#4f6275','#6b4f3a','#5e4a63','#77796f']),hat:pick(SCARVES),hs:1,hair:'#c7c0b0',bag:3,fur:null,perm:false,long:true};
}
function decoyOf(L){
  const d={...L};
  const feats=L.hat?['hat','bag']:['hair','bag','hat'];
  const f=pick(feats);
  if(f==='bag'){d.bag=pick([0,1,2].filter(b=>b!==L.bag))}
  else if(f==='hat'){d.hat=pick(HATS.filter(h=>h!==L.hat))}
  else{d.hair=pick(HAIRS.filter(h=>h!==L.hair))}
  return d;
}

/* ---------- drawing ---------- */
function person(ctx,p,x,y,face=-1){
  x=Math.round(x);y=Math.round(y);
  const r=(c,a,b,w,h)=>{ctx.fillStyle=c;ctx.fillRect(x+a,y+b,w,h)};
  r(C.ink,-3,-6,2,6);r(C.ink,1,-6,2,6);
  r(p.coat,-4,-19,9,12);r(p.coat,-5,-9,11,3);
  if(p.long){r(p.coat,-5,-7,11,4);r('#2a2622',-3,-3,2,3);r('#2a2622',1,-3,2,3)}
  r('rgba(0,0,0,.16)',face<0?2:-4,-18,2,10);
  if(p.fur)r(p.fur,-4,-20,9,2);
  const hx=p.long?(face<0?-1:1):0; // old women stoop forward
  const R=(c,a,b,w,h)=>r(c,a+hx,b+(p.long?1:0),w,h);
  R(C.skin,-3,-25,6,6);
  const back=face<0?1:-3;
  if(!p.hat){
    if(p.perm){R(p.hair,-5,-28,10,6);R(p.hair,back-1,-24,4,5);R('rgba(255,255,255,.22)',-4,-27,1,1);R('rgba(255,255,255,.22)',0,-28,1,1);R('rgba(255,255,255,.22)',3,-26,1,1);R('rgba(0,0,0,.2)',-2,-26,1,1)}
    else{R(p.hair,-3,-26,6,2);R(p.hair,back,-24,2,4)}
  }
  else if(p.hs===1){R(p.hat,-4,-27,8,3);R(p.hat,face<0?0:-4,-25,4,6);R(p.hat,-1,-19,2,1);R('rgba(255,255,255,.35)',face<0?1:-3,-23,1,1)}
  else if(p.hs===2){R(p.hat,-5,-28,10,4);R(p.hat,face<0?3:-5,-24,2,5)}
  else if(p.hs===3){R(p.hair,back,-24,2,3);R(p.hat,-4,-27,8,2);R(p.hat,face<0?-6:2,-26,4,1)}
  else if(p.hs===4){R(p.hat,-4,-31,8,6);R('rgba(0,0,0,.2)',-3,-30,1,1);R('rgba(0,0,0,.2)',1,-29,1,1);R('rgba(255,255,255,.15)',-1,-31,2,1)}
  else{R(p.hat,-4,-27,8,3)}
  R(C.ink,face<0?-2:1,-23,1,1);
  const bx=face<0?5:-9;
  if(p.bag===3){ // checked shopping trolley pulled behind
    const cx=face<0?7:-11;
    r(C.ink,cx+(face<0?3:0),-16,1,14);
    for(let yy=0;yy<8;yy++)for(let xx=0;xx<4;xx++)r(((xx+yy)%2)?'#b8423a':'#2a2622',cx+xx,-10+yy,1,1);
    r(C.ink,cx,-2,4,1);r('#77796f',cx+1,-1,2,1);
  }
  if(p.bag===1){
    r(C.ink,bx,-12,4,1);r(C.ink,bx,-7,4,1);r(C.ink,bx,-12,1,6);r(C.ink,bx+3,-12,1,6);
    r('#e0962f',bx+1,-10,2,2);r(C.ink,bx+1,-14,1,2);
  }else if(p.bag===2){
    r('#4a3020',bx,-11,4,4);r('#4a3020',bx+1,-13,2,1);
  }
}
function child(ctx,x,y,coat='#5d7f91',hat='#b8423a'){
  const r=(c,a,b,w,h)=>{ctx.fillStyle=c;ctx.fillRect(x+a,y+b,w,h)};
  r(C.ink,-2,-4,1,4);r(C.ink,1,-4,1,4);
  r(coat,-3,-12,7,8);
  r(C.skin,-2,-17,5,5);
  r(hat,-3,-19,7,3);r(C.white,0,-21,2,2);
  r(C.ink,-1,-15,1,1);r(C.ink,1,-15,1,1);
}

const SONGS={
  pop:{name:'туц-туц с рынка',bpm:128,bars:[...POP_A,...POP_A,...POP_B,...POP_B],loops:2,lead:25,leadVol:.07,vib:0,
    acc(step,ch,t,sd,w){

    acc(step,ch,t,sd,w){

function note(f,t,dur,wave,vol,vib=0){
  if(!ac||!mus)return;
  const o=ac.createOscillator(),gn=ac.createGain();
  if(wave==='tri')o.type='triangle';else o.setPeriodicWave(PW[wave]);
  o.frequency.setValueAtTime(f,t);
  if(vib&&dur>.25){const l=ac.createOscillator(),lg=ac.createGain();l.frequency.value=5.6;lg.gain.setValueAtTime(0,t);lg.gain.linearRampToValueAtTime(f*.012,t+.2);l.connect(lg).connect(o.frequency);l.start(t);l.stop(t+dur+.1)}

  gn.gain.setValueAtTime(vol*.8,t+Math.max(.01,dur-.04));gn.gain.exponentialRampToValueAtTime(.0001,t+dur+.03);
  o.connect(gn).connect(mus.out);o.start(t);o.stop(t+dur+.06);
}

}
function kick(t,vol){

  o.frequency.setValueAtTime(130,t);o.frequency.exponentialRampToValueAtTime(42,t+.11);
  gn.gain.setValueAtTime(vol,t);gn.gain.exponentialRampToValueAtTime(.0001,t+.16);
  o.connect(gn).connect(mus.out);o.start(t);o.stop(t+.18);
}
const snare=(t,v)=>noiseHit(t,v,'bandpass',1800,.13);
const hat=(t,v)=>noiseHit(t,v,'highpass',7000,.035);
function musicStart(){
  if(!ac||!master||!musicOn)return;
  musicStop();
  const out=ac.createGain(),lp=ac.createBiquadFilter();
  out.gain.value=0;lp.type='lowpass';lp.frequency.value=5200;
  out.connect(lp).connect(master);

  mus.timer=setInterval(musicTick,25);
  trackLabel();
}
function musicStop(){
  if(!mus)return;
  clearInterval(mus.timer);
  const o=mus.out;mus=null;
  try{o.gain.setTargetAtTime(0,ac.currentTime,.04);setTimeout(()=>{try{o.disconnect()}catch(e){}},500)}catch(e){}
  trackLabel();
}
function musicTick(){
  if(!mus||!ac)return;
  const a=(st&&st.anx)||0;
  while(mus.next<ac.currentTime+.15){
    const S=SONGS[mus.song],sd=60/S.bpm/4*(1+a*.14),t=mus.next;
    // chewed tape: pitch wobbles and drifts as panic grows
    const w=f=>f*(1+a*.028*Math.sin(t*5.3)+a*.022*Math.sin(t*.8));
    const B=S.bars[mus.bar],ch=CH[B[0]];
    for(const [s,n,l] of B[1])if(s===mus.step)note(w(mf(n)),t,l*sd*.92,S.lead,S.leadVol,S.vib);
    S.acc(mus.step,ch,t,sd,w);
    mus.next+=sd;mus.step++;
    if(mus.step>=16){
      mus.step=0;mus.bar++;
      if(mus.bar>=S.bars.length){
        mus.bar=0;mus.loops++;
        if(mus.loops>=S.loops){mus.loops=0;mus.song=mus.song==='pop'?'chanson':'pop';noiseHit(mus.next,.2,'lowpass',900,.08);mus.next+=.7;trackLabel()}
      }
    }
  }
  const play=st&&st.phase==='play';
  const target=(st&&st.phase==='menu')?.3:(st&&st.phase==='intro')?.35:!play?0:(st.sales&&st.sales.t<2.9)?0:st.scandal?.22:.6;
  mus.out.gain.setTargetAtTime(target,ac.currentTime,.06);
  mus.lp.frequency.setTargetAtTime(st&&st.scene==='hall'?1000:5200,ac.currentTime,.2);
}
function trackLabel(){
  const el=$('track');if(!el)return;
  el.textContent=musicOn?(mus?'♪ '+SONGS[mus.song].name:'♪ вкл'):'♪ выкл';
  $('musicBtn').setAttribute('aria-pressed',musicOn);

function thump(t0,vol){
  if(!ac||!master)return;
  const o=ac.createOscillator(),gn=ac.createGain();
  o.frequency.setValueAtTime(72,t0);o.frequency.exponentialRampToValueAtTime(40,t0+.13);
  gn.gain.setValueAtTime(.0001,t0);gn.gain.exponentialRampToValueAtTime(vol,t0+.012);gn.gain.exponentialRampToValueAtTime(.0001,t0+.2);
  o.connect(gn).connect(master);o.start(t0);o.stop(t0+.22);
}
function beep(f,dur,type='square',vol=.05){
  if(!ac||!master)return;
  const t0=ac.currentTime,o=ac.createOscillator(),gn=ac.createGain();

function update(dt){
  st.t+=dt;
  const d=clamp(st.t/T);
  // difficulty: look-alikes
  const wantQ=Math.min(L.maxDec,Math.floor(d*3.4));
  while(qp.filter(p=>p.role==='decoy').length<wantQ){
    const c=qp.filter(p=>p.role==='npc');if(!c.length)break;
    const p=pick(c);p.role='decoy';p.look=decoyOf(TARGET);
  }
  const wantShoppers=4+Math.floor(d*5);

  if(hp.filter(p=>p.role==='babka').length<1+Math.floor(d*3))hp.push(newShopper(babkaLook(),'babka',false));

    if(st.scene==='hall'&&Math.random()<.55){
      a=qp.find(p=>p.role==='target');
      const deeper=qp.filter(p=>p!==a&&p.slot>a.slot);
      b=deeper.length?pick(deeper):pick(qp.filter(p=>p!==a));
    }
    [a.slot,b.slot]=[b.slot,a.slot];
    if(st.scene==='queue')beep(180,.08,'triangle',.04);
    st.shufT=(st.scene==='queue'?lerp(14,7,d):lerp(5.5,2.8,d))*L.shuf;
  }
  for(const p of qp){
    p.dp+=(p.slot-p.dp)*Math.min(1,dt*2.5);
    p.mark=Math.max(0,p.mark-dt);
    // people lean out to see the counter, then step back
    p.shiftT-=dt;
    if(p.shiftT<=0){
      if(p.shift===0&&Math.random()<dt*lerp(.08,.35,d)){p.shift=(Math.random()<.5?-1:1)*(2+Math.random()*lerp(3,7,d));p.shiftT=1+Math.random()*2}

  for(const p of hp){

      continue;
    }

    p.x+=p.vx*dt;
    if(p.leaving){if(p.x<-12||p.x>172){p.gone=true;p.awayT=lerp(2,4.5,d)}continue}

      p.x=clamp(p.x,4,156);p.vx=-p.vx;

const VOICES={
  'Продавщица':{f:140,spread:.35,wave:12,vol:.16,dur:.075,speed:.055,growl:true,angry:true,every:1},
  'Тётка':{f:500,spread:.4,wave:12,vol:.11,dur:.045,speed:.034,angry:true,every:1},
  'Очередь':{f:240,spread:.35,wave:25,vol:.1,dur:.055,speed:.04,angry:true,every:1},
  'Грузчики':{f:80,spread:.2,wave:25,vol:.13,dur:.08,speed:.055,growl:true,angry:true,every:1},
  'Мама':{f:340,spread:.14,wave:'tri',vol:.32,dur:.065,speed:.045,every:2},
  '':{f:640,spread:.1,wave:50,vol:.035,dur:.03,speed:.04,every:2}
};
const VOWELS='аеёиоуыэюяАЕЁИОУЫЭЮЯ';
function voiceOf(txt){const m=/^([А-ЯЁа-яё]+):/.exec(txt||'');return (m&&VOICES[m[1]])?m[1]:''}
function blip(v,ch,i,n,excl){
  if(!ac||!master)return;
  if(!PW)PW={12:pulse(.125),25:pulse(.25),50:pulse(.5)};
  const V=VOICES[v],t=ac.currentTime;
  let f=V.f*(1+(Math.random()-.5)*V.spread);
  if(VOWELS.includes(ch))f*=1.12;
  if(excl&&i>n-6)f*=VOICES[v].angry?1.35:1.18;
  if(VOICES[v].angry&&Math.random()<.25)f*=1.25;   // random stressed syllables                       // shouting rises at the end
  if(!excl&&n>8&&i>n-4)f*=.9;                    // calm lines fall at the end
  const mk=(freq,vol)=>{
    const o=ac.createOscillator(),gn=ac.createGain();
    if(V.wave==='tri')o.type='triangle';else o.setPeriodicWave(PW[V.wave]);
    if(V.angry){ // a bark: snaps up, then drops hard
      o.frequency.setValueAtTime(freq*1.3,t);o.frequency.exponentialRampToValueAtTime(freq*.72,t+V.dur);
      gn.gain.setValueAtTime(.0001,t);gn.gain.exponentialRampToValueAtTime(vol,t+.004);gn.gain.setValueAtTime(vol,t+V.dur*.55);
    }else{
      o.frequency.setValueAtTime(freq,t);o.frequency.exponentialRampToValueAtTime(freq*.86,t+V.dur);
      gn.gain.setValueAtTime(vol,t);
    }
    gn.gain.exponentialRampToValueAtTime(.0001,t+V.dur);
    o.connect(gn).connect(master);o.start(t);o.stop(t+V.dur+.02);
  };
  mk(f,V.vol);
  if(V.growl)mk(f*1.5+7,V.vol*.45);
}
function typeTick(dt){
  if(!st||st.typed===st.typeFull)return;
  const v=voiceOf(st.typeFull),V=VOICES[v];
  st.typeT-=dt;
  if(st.typeT>0)return;
  const full=st.typeFull,i=st.typed.length,ch=full[i];
  st.typed=full.slice(0,i+1);$('thought').textContent=st.typed;
  // the name before the colon prints instantly and silently

function tap(e){
  if(st&&st.phase==='intro'){st.it=Math.max(st.it,INTRO_DUR);return}
  if(!st||st.phase!=='play')return;
  const r=cv.getBoundingClientRect();
  const x=(e.clientX-r.left)/r.width*W,y=(e.clientY-r.top)/r.height*H;
  let hit=null;
  if(st.scene==='queue'){
    // pixel-accurate: only the visible part of a person counts; small tolerance ring for fingers
    const px=Math.floor(x),py=Math.floor(y);
    const probe=[[0,0],[1,0],[-1,0],[0,1],[0,-1],[2,0],[-2,0],[0,2],[0,-2],[2,2],[-2,2],[2,-2],[-2,-2],[3,0],[-3,0],[0,3],[0,-3]];
    for(const [ox,oy] of probe){
      const xx=px+ox,yy=py+oy;if(xx<0||yy<0||xx>=W||yy>=H)continue;
      const c=hg.getImageData(xx,yy,1,1).data;
      if(c[3]>0&&c[0]>0){hit=qp[c[0]-1];break}
    }
    if(!hit)return;
    if(hit.role==='target'){st.q=1;st.qHold=1.2;hit.mark=.5;hit.markOk=true;beep(880,.07,'square',.05);st.thoughtT=0}
    else{st.q-=.12;st.mistakes++;hit.mark=.6;hit.markOk=false;beep(130,.15,'square',.06);say(pick(['Не та тётя…','Это не она…','У той была авоська…']));st.thoughtOverride=1.6}
  }else{
    if(blockedAt(x,y)){beep(200,.05,'square',.03);return}
    for(let i=2;i>=0&&!hit;i--){
      const ly=LY[i];
      for(const p of hp){
        if(p.lane!==i||p.gone)continue;
        if(Math.abs(x-p.x)<=7&&y>=ly-33&&y<=ly){if(!hit||Math.abs(x-p.x)<Math.abs(x-hit.x))hit=p}
      }
    }
    if(!hit)return;
    if(hit.role==='mama'){st.m=1;st.mHold=1.2;hit.mark=.5;hit.markOk=true;beep(990,.07,'square',.05);st.thoughtT=0}
    else{st.m-=.12;st.mistakes++;hit.mark=.6;hit.markOk=false;beep(130,.15,'square',.06);say(pick(['Это не мама…','У мамы меховая шапка…','Похожа. Но не она.']));st.thoughtOverride=1.6}
  }
}

function drawVictory(t,good){
  const cx=80,cy=56;
  g.fillStyle='#2a1d12';g.fillRect(0,0,W,H);
  const rot=t*.35;
  for(let i=0;i<16;i++){
    const a0=i/16*Math.PI*2+rot;
    g.fillStyle=i%2?'rgba(255,200,90,.22)':'rgba(255,200,90,.08)';
    g.beginPath();g.moveTo(cx,cy);
    g.lineTo(cx+Math.cos(a0)*220,cy+Math.sin(a0)*220);g.lineTo(cx+Math.cos(a0+Math.PI/8)*220,cy+Math.sin(a0+Math.PI/8)*220);
    g.closePath();g.fill();
  }
  // glow behind the prize
  for(let r=46;r>0;r-=6){g.fillStyle=`rgba(255,226,140,${.05+(46-r)/46*.12})`;g.beginPath();g.arc(cx,cy,r,0,Math.PI*2);g.fill()}
  // prize pops in with an overshoot, then floats
  const u=clamp((t-.15)/.6),k=u<1?(1-Math.pow(1-u,3))*(1+.25*Math.sin(u*Math.PI)):1;
  const bob=Math.round(Math.sin(t*2.4)*2);
  const im=good?PRIZE_EGG:PRIZE_GUM,w0=good?80:92,h0=good?73:71;
  if(k>0){
    const w=Math.round(w0*k),h=Math.round(h0*k);
    g.imageSmoothingEnabled=false;g.drawImage(im,Math.round(cx-w/2),Math.round(cy-h/2)+bob,w,h);
  }
  // confetti
  if(!st.conf){st.conf=Array.from({length:46},()=>({x:Math.random()*W,y:-Math.random()*150,v:20+Math.random()*30,c:pick(['#e8c45a','#c8382e','#5a94d8','#f2eddc','#5f8a6a']),ph:Math.random()*6}))}
  if(t>.3)for(const c of st.conf){
    const y=(c.y+(t-.3)*c.v)%170,x=c.x+Math.sin(t*2+c.ph)*4;
    g.fillStyle=c.c;g.fillRect(Math.round(x),Math.round(y),Math.sin(t*6+c.ph)>0?2:1,2);
  }
  // sparkles around the prize
  for(let i=0;i<6;i++){
    const a=i/6*Math.PI*2+t*.8,r=50+Math.sin(t*3+i)*4,on=Math.sin(t*6+i*2)>.2;
    if(on){const x=Math.round(cx+Math.cos(a)*r),y=Math.round(cy+Math.sin(a)*r*.8);g.fillStyle='#fff3b0';g.fillRect(x,y-1,1,3);g.fillRect(x-1,y,3,1)}
  }
  // «ПОБЕДА!» banner, blinking like an old cartridge
  if(t>.5){
    const str='ПОБЕДА!',kk=3,w=txtW(str)*kk,x=Math.round(80-w/2),y=4;
    bigTxt(str,x+1,y+1,kk,'#5a2a10');
    bigTxt(str,x,y,kk,Math.floor(t*4)%2?'#ffe27a':'#f2b84a');
  }
  if(t<.12){g.fillStyle=`rgba(255,255,255,${1-t/.12})`;g.fillRect(0,0,W,H)}
}
function showVictoryText(){
  const good=st.level===2,ov=$('overlay');
  ov.hidden=false;ov.className='overlay prize';
  ov.innerHTML=`<p>Уровень ${st.level} пройден · ${good?'шоколадное яйцо':'жвачка с вкладышем'}</p><div class="row"><button class="btn" id="again" type="button">Ещё раз</button><button class="btn ghost" id="menu" type="button">Меню</button></div>`;
  $('again').onclick=()=>begin(st.level,false);
  $('menu').onclick=showMenu;
  const line='Мама: «Спасибо! А то как бы я без тебя?!»';
  say(line);
  st.scene='hall';drawCard();
  $('goal').innerHTML='МАМА ВЕРНУЛАСЬ<small>все на месте</small>';
  $('clock').textContent=fmt(T);
}
/* triumphant NES-style fanfare, C major, about four seconds */
function fanfare(){
  if(!ac||!master)return;
  if(!PW)PW={12:pulse(.125),25:pulse(.25),50:pulse(.5)};
  const t0=ac.currentTime+.05,b=.11;
  const N=(m,at,len,wave,vol)=>{
    const o=ac.createOscillator(),gn=ac.createGain(),t=t0+at*b,d=len*b;
    if(wave==='tri')o.type='triangle';else o.setPeriodicWave(PW[wave]);
    o.frequency.value=mf(m);
    gn.gain.setValueAtTime(.0001,t);gn.gain.exponentialRampToValueAtTime(vol,t+.008);
    gn.gain.setValueAtTime(vol*.85,t+Math.max(.02,d-.05));gn.gain.exponentialRampToValueAtTime(.0001,t+d+.04);
    o.connect(gn).connect(master);o.start(t);o.stop(t+d+.08);
  };
  // lead: ta-ta-ta TAAA, ta-ta-ta TAAA, then the climb and a long final chord
  const lead=[[67,0,1],[67,1,1],[67,2,1],[72,3,5],[68,8,1],[68,9,1],[68,10,1],[72,11,5],[70,16,1],[70,17,1],[70,18,1],[74,19,3],[76,22,2],[77,24,2],[79,26,2],[84,28,10]];
  lead.forEach(([m,at,l])=>N(m,at,l*.95,25,.09));
  const harm=[[64,3,5],[65,11,5],[67,19,3],[72,28,10],[76,28,10]];
  harm.forEach(([m,at,l])=>N(m,at,l*.95,50,.04));
  const bass=[[48,0,3],[48,3,5],[44,8,3],[44,11,5],[46,16,3],[46,19,3],[43,22,6],[36,28,10]];
  bass.forEach(([m,at,l])=>N(m,at,l*.9,'tri',.35));
  // drum roll into the last chord
  for(let i=0;i<8;i++)setTimeout(()=>{if(ac&&master)noiseHitM(.08+i*.012)},((20+i)*b+.05)*1000);
  setTimeout(()=>{if(ac&&master){noiseHitM(.3);thump(ac.currentTime,.9)}},(28*b+.05)*1000);
}
function noiseHitM(vol){
  if(!noiseBuf)return;
  const t=ac.currentTime,sr=ac.createBufferSource(),f=ac.createBiquadFilter(),gn=ac.createGain();
  sr.buffer=noiseBuf;f.type='bandpass';f.frequency.value=1800;
  gn.gain.setValueAtTime(vol,t);gn.gain.exponentialRampToValueAtTime(.0001,t+.12);
  sr.connect(f).connect(gn).connect(master);sr.start(t,Math.random());sr.stop(t+.14);
}
/* the prize, big, on its own */
function drawPrize(good){
  g.fillStyle='#2a2117';g.fillRect(0,0,W,H);
  const cx=80,cy=46;
  for(let i=0;i<16;i++){
    const a0=i/16*Math.PI*2+.1;
    g.fillStyle=i%2?'rgba(255,214,120,.16)':'rgba(255,214,120,.07)';
    g.beginPath();g.moveTo(cx,cy);
    g.lineTo(cx+Math.cos(a0)*200,cy+Math.sin(a0)*200);g.lineTo(cx+Math.cos(a0+Math.PI/8)*200,cy+Math.sin(a0+Math.PI/8)*200);
    g.closePath();g.fill();
  }
  g.fillStyle='rgba(0,0,0,.35)';g.fillRect(40,86,80,3);
  g.imageSmoothingEnabled=false;
  if(good)g.drawImage(PRIZE_EGG,35,4,90,82);
  else g.drawImage(PRIZE_GUM,32,12,96,74);
  g.fillStyle='#fff3b0';for(const [x,y] of [[30,14],[130,10],[136,50],[22,58],[120,4]])g.fillRect(x,y,2,2);
}
function statsLine(){
  const parts=['время '+fmt(Math.min(st.t,T)),'ошибок '+st.mistakes];
  if(st.lastEvent)parts.push('последнее событие: '+st.lastEvent.n+', '+Math.max(0,Math.round(st.t-st.lastEvent.t))+' с назад');
  return '<p class="hint">'+parts.join(' · ')+'</p>';
}
function fmt(t){const s=Math.floor(t);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function end(kind){
  st.phase='end';cancelAnimationFrame(raf);st.sales=null;st.scandal=null;musicStop();
  $('tabQ').classList.remove('warn');$('tabH').classList.remove('warn');
  const ov=$('overlay');ov.hidden=false;ov.className='overlay';
  if(kind==='mama'){
    audioStop();
    g.fillStyle='#000';g.fillRect(0,0,W,H);
    ov.innerHTML=`<h1 class="big">МАМА?</h1><p>Прошло ${fmt(st.t)}. В зале её больше нет.</p>${statsLine()}<div class="row"><button class="btn" id="again" type="button">Ещё раз</button><button class="btn ghost" id="menu" type="button">Меню</button></div>`;
    say('');
  }else if(kind==='queue'){
    audioStop();
    st.scene='queue';drawQueue();vignette(.9);
    ov.innerHTML=`<h1>«Вас тут не стояло!»</h1><p>Тёть в красном теперь три. За какой из них очередь, уже не доказать. Время: ${fmt(st.t)}.</p>${statsLine()}<div class="row"><button class="btn" id="again" type="button">Ещё раз</button><button class="btn ghost" id="menu" type="button">Меню</button></div>`;
    say('');
  }else{
    try{localStorage.setItem('yzt-won-'+st.level,'1')}catch(e){}
    if(crowdGain)crowdGain.gain.value=0;
    ov.hidden=true;
    st.phase='victory';st.vt=0;st.vShown=false;
    fanfare();
    const tok=st;setTimeout(()=>{if(st===tok)audioStop()},6500);
    say('');
    last=performance.now();raf=requestAnimationFrame(loop);
    return;
  }
  $('again').onclick=()=>begin(st.level,false);
  $('menu').onclick=showMenu;
}

function begin(level,intro){
  $('overlay').hidden=true;
  $('app').classList.remove('inmenu');
  L=LV[level];
  init();st.level=level;
  audioStart();
  if(intro){st.phase='intro';st.it=0}
  last=performance.now();
  cancelAnimationFrame(raf);raf=requestAnimationFrame(loop);
}
function wonLevels(){let w={1:false,2:false};try{w={1:!!localStorage.getItem('yzt-won-1'),2:!!localStorage.getItem('yzt-won-2')}}catch(e){}return w}
function menuScreen(html,top){
  if(!st||st.phase!=='menu'){
    cancelAnimationFrame(raf);
    init();st.phase='menu';st.cat={mode:'sleep',t:0,dur:9,squeak:false};
    last=performance.now();raf=requestAnimationFrame(loop);
    if(ac)audioStart();
    if(crowdGain)crowdGain.gain.value=.015;
  }
  $('app').classList.add('inmenu');say('');st.titleMode=top==='title';
  const ov=$('overlay');ov.hidden=false;ov.className=top==='title'?'overlay titleov':'overlay menuov'+(top?' top':'');ov.innerHTML=html;
  const first=ov.querySelector('.mi');if(first)first.focus({preventScroll:true});
}
function showTitle(){
  menuScreen(`<div><h1 class="title">Я ЗА ТЁТЕЙ</h1>
    <p class="tag">«Стой за тётей. Я быстро».</p></div>
    <p class="press blink">НАЖМИ, ЧТОБЫ НАЧАТЬ</p>`,'title');
  const ov=$('overlay');
  const go=()=>{ov.onpointerdown=null;audioStart();if(crowdGain)crowdGain.gain.value=.015;showMain()};
  ov.onpointerdown=go;st.onTitle=go;
}
function showMain(){
  menuScreen(`<h1 class="title sm">Я ЗА ТЁТЕЙ</h1>
    <div class="menu">
      <button class="mi" type="button" id="m-play">ИГРАТЬ</button>
      <button class="mi" type="button" id="m-how">КАК ИГРАТЬ</button>
      <button class="mi" type="button" id="m-snd">ЗВУК: ${musicOn?'ВКЛ':'ВЫКЛ'}</button>
    </div>
    <p class="copy">© TATAR ROUTINE</p>`);
  $('m-play').onclick=showLevels;
  $('m-how').onclick=showHow;
  $('m-snd').onclick=()=>{toggleMusic();$('m-snd').textContent='ЗВУК: '+(musicOn?'ВКЛ':'ВЫКЛ')};
}
function showLevels(){
  const w=wonLevels();
  menuScreen(`<h1 class="title sm">ВЫБЕРИ ДЕНЬ</h1>
    <div class="menu">
      <button class="mi" type="button" id="m-l1">УРОВЕНЬ 1 ${w[1]?'<em>★</em>':''}<small>За хлебом в будний день.</small></button>
      <button class="mi" type="button" id="m-l2">УРОВЕНЬ 2 ${w[2]?'<em>★</em>':''}<small>За колбасой перед праздником.</small></button>
      <button class="mi" type="button" id="m-back">НАЗАД</button>
    </div>`);
  $('m-l1').onclick=()=>begin(1,true);
  $('m-l2').onclick=()=>begin(2,true);
  $('m-back').onclick=showMain;
}
function showHow(){
  menuScreen(`<h1 class="title sm">КАК ИГРАТЬ</h1>
    <ul class="rules">
      <li><canvas id="hw-t" width="20" height="34"></canvas><div><b>ОЧЕРЕДЬ</b>Тыкай в тётю в красном пальто, чтобы не потерять место.</div></li>
      <li><canvas id="hw-m" width="20" height="34"></canvas><div><b>ЗАЛ</b>Тыкай в маму в меховой шапке, чтобы не потерять её.</div></li>
      <li><canvas id="hw-c" width="20" height="34"></canvas><div><b>2 МИНУТЫ</b>Пока смотришь на одну, теряешь другую. Дождись маму.</div></li>
    </ul>
    <div class="menu"><button class="mi" type="button" id="m-back">НАЗАД</button></div>`,true);
  $('m-back').onclick=showMain;
  try{
    const ct=$('hw-t').getContext('2d');ct.fillStyle='#ece6d3';ct.fillRect(0,0,20,34);personBack(ct,TARGET,10,33,1);
    const cm=$('hw-m').getContext('2d');cm.fillStyle='#ece6d3';cm.fillRect(0,0,20,34);person(cm,MAMA,10,33,-1);
    const cc=$('hw-c').getContext('2d');cc.fillStyle='#ece6d3';cc.fillRect(0,0,20,34);
    cc.fillStyle=C.ink;cc.fillRect(3,10,14,14);cc.fillStyle=C.white;cc.fillRect(4,11,12,12);
    cc.fillStyle=C.ink;cc.fillRect(10,13,1,5);cc.fillRect(10,17,4,1);cc.fillStyle='#c8382e';cc.fillRect(10,17,1,1);
  }catch(e){}
}
const showMenu=showMain;
function pauseGame(){
  if(!st||st.phase!=='play')return;
  st.phase='paused';cancelAnimationFrame(raf);$('pause').hidden=true;
  const ov=$('overlay');ov.hidden=false;ov.className='overlay';
  ov.innerHTML=`<h1 class="title sm">ПАУЗА</h1>
    <div class="menu">
      <button class="mi" type="button" id="p-go">ПРОДОЛЖИТЬ</button>
      <button class="mi" type="button" id="p-re">НАЧАТЬ ЗАНОВО</button>
      <button class="mi" type="button" id="p-menu">В МЕНЮ</button>
    </div>`;
  $('p-go').onclick=resumeGame;
  $('p-re').onclick=()=>begin(st.level,false);
  $('p-menu').onclick=showMain;
  $('p-go').focus({preventScroll:true});
}
function resumeGame(){
  if(!st||st.phase!=='paused')return;
  $('overlay').hidden=true;st.phase='play';last=performance.now();raf=requestAnimationFrame(loop);
}
function toggleMusic(){
  musicOn=!musicOn;
  try{localStorage.setItem('yzt-music',musicOn?'on':'off')}catch(e){}
  if(musicOn&&master)musicStart();else musicStop();
  trackLabel();
}
function toggle(){if(st&&st.phase==='play')setScene(st.scene==='queue'?'hall':'queue')}

$('musicBtn').onclick=toggleMusic;
$('pause').onclick=pauseGame;
document.addEventListener('visibilitychange',()=>{if(document.hidden)pauseGame()});
$('tabQ').onclick=()=>{if(st&&st.phase==='play')setScene('queue')};
$('tabH').onclick=()=>{if(st&&st.phase==='play')setScene('hall')};
cv.addEventListener('pointerdown',tap);
addEventListener('keydown',e=>{
  if(st&&st.phase==='menu'&&st.onTitle&&!$('overlay').hidden&&$('overlay').querySelector('.press')){e.preventDefault();const f=st.onTitle;st.onTitle=null;f();return}
  const items=[...$('overlay').querySelectorAll('.mi')];
  if(!$('overlay').hidden&&items.length&&(e.key==='ArrowDown'||e.key==='ArrowUp')){
    e.preventDefault();const k=items.indexOf(document.activeElement);
    items[(k+(e.key==='ArrowDown'?1:-1)+items.length)%items.length].focus();return;
  }
  if(st&&st.phase==='play'&&(e.key==='Escape'||e.key==='p'||e.key==='з')){e.preventDefault();pauseGame();return}
  if(st&&st.phase==='paused'&&e.key==='Escape'){e.preventDefault();resumeGame();return}
  if(st&&st.phase==='intro'&&(e.key===' '||e.key==='Enter')){e.preventDefault();st.it=INTRO_DUR;return}
  if(!st||st.phase!=='play')return;
  if(e.key==='1')setScene('queue');else if(e.key==='2')setScene('hall');
  else if(e.key===' '){e.preventDefault();toggle()}
});

// resting frame before start
init();st.phase='idle';drawCard();trackLabel();showTitle();
</script>
