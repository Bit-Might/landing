<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>НЕ ВСЁ В ПОРЯДКЕ - Симулятор ОКР</title>
    <link rel="stylesheet" href="styles.css" />
</head>
<body>

    <!-- ========== ЗАСТАВКА ========== -->
    <div class="splash-screen" id="splash" onclick="hideSplash()">
        <img src="splash.png" alt="НЕ ВСЁ В ПОРЯДКЕ" class="splash-image">
        <div class="splash-hint">Кликните чтобы начать</div>
    </div>

    <!-- ========== ИГРОВОЙ ИНТЕРФЕЙС ========== -->
    <div class="menu-bar">
        <div class="menu-left">
            <span class="bold"></span>
            <span id="level-indicator">Уровень 1/4</span>
        </div>
        <div class="menu-right">
            <span id="clock">12:00</span>
        </div>
    </div>

    <!-- Таймер запоминания -->
    <div id="timer-bar"></div>

    <!-- Статус игры -->
    <div id="status-msg">Запомните расположение папок!</div>

    <!-- Кнопка старта -->
    <div id="start-btn"><img src="start.svg"></div>

    <!-- Кнопка проверки -->
    <div><img id="check-btn" src="check_button.png"></div>

    <!-- Игровая область -->
    <div id="game-area"></div>

    <!-- Результаты -->
    <div id="results">
        <h2>РЕЗУЛЬТАТ</h2>
            <div id="score-circle"><span class="score-value" id="score-value">0%</span></div>
        <div class="score-label">ТОЧНОСТЬ ПОЗИЦИОНИРОВАНИЯ</div>
        <div class="error-details" id="error-details"></div>
        <div><img id="next-btn" src="next_level.png"></div>
    </div>

    <!-- Экран победы -->
    <div id="victory-screen" style="display: none;">
        <h2>ПОЗДРАВЛЯЕМ!</h2>
        <p class="victory-subtitle">Все 4 уровня пройдены!</p>
        <div id="play-again-btn"><img src="restart.svg"></div>
    </div>

<script>
    // ========== ЗАСТАВКА ==========
    function hideSplash() {
        const splash = document.getElementById('splash');
        splash.classList.add('hidden');
        setTimeout(() => {
            splash.style.display = 'none';
        }, 800);
    }

    // Конфигурация
    const SLOT_SIZE = 100;
    const GAP = 20;
    const PERFECT_THRESHOLD = 10; // Пикселей для идеального совпадения
    const MAX_ERROR_DISTANCE = 200; // Максимальная ошибка для 0%

    const LEVELS = [
      { folders: 4,  cols: 2, rows: 2, memorizeTime: 3000 },
      { folders: 8,  cols: 4, rows: 2, memorizeTime: 5000 },
      { folders: 16, cols: 4, rows: 4, memorizeTime: 5000 },
      { folders: 24, cols: 6, rows: 4, memorizeTime: 5000 },
    ];
    let currentLevel = 0;

    function getLevel() { return LEVELS[currentLevel]; }

    const gameArea = document.getElementById('game-area');
    const statusMsg = document.getElementById('status-msg');
    const startBtn = document.getElementById('start-btn');
    const checkBtn = document.getElementById('check-btn');
    const nextBtn = document.getElementById('next-btn');
    const timerBar = document.getElementById('timer-bar');
    const resultsEl = document.getElementById('results');

    let slots = [];
    let folders = [];
    let centerPoints = []; // Центральные точки ячеек

    // Для перетаскивания
    let isDragging = false;
    let currentFolder = null;
    let dragOffsetX = 0;
    let dragOffsetY = 0;

    // Часы
    setInterval(() => {
        const now = new Date();
        document.getElementById('clock').textContent = now.toLocaleTimeString('ru-RU', {hour:'2-digit', minute:'2-digit'});
    }, 1000);

    startBtn.addEventListener('click', function() {
    startGame();
});

    checkBtn.addEventListener('click', function() {
    checkResults();
});

    function updateLevelIndicator() {
        const indicator = document.getElementById('level-indicator');
        if (indicator) {
            indicator.textContent = `Уровень ${currentLevel + 1}/${LEVELS.length}`;
        }
    }

    nextBtn.addEventListener('click', function() {
    if (currentLevel < LEVELS.length - 1) {
        currentLevel++;
        updateLevelIndicator();
        gameArea.innerHTML = '';
        slots = [];
        folders = [];
        centerPoints = [];
        resultsEl.style.display = 'none';
        nextBtn.style.display = 'none';
        startGame();
    } else {
        resultsEl.style.display = 'none';
        nextBtn.style.display = 'none';
        document.getElementById('victory-screen').style.display = 'block';
    }
});

    const playAgainBtn = document.getElementById('play-again-btn');

        location.reload();

    function startGame() {
        startBtn.style.display = 'none';
        gameArea.innerHTML = '';
        slots = [];
        folders = [];
        centerPoints = [];
        createGrid();
        createFolders();

        placeFoldersInGrid();
        statusMsg.style.opacity = 1;
        statusMsg.textContent = "Запомните расположение по сетке...";

        timerBar.style.width = '0%';
        setTimeout(() => { timerBar.style.width = '100%'; }, 10);
        setTimeout(() => { timerBar.style.width = '0%'; }, getLevel().memorizeTime);

        setTimeout(() => {
            hideGrid();
            scrambleFolders();
            statusMsg.textContent = "Восстановите расположение по памяти";
            checkBtn.style.display = 'block';
            setTimeout(() => { statusMsg.style.opacity = 0; }, 2000);
        }, getLevel().memorizeTime);
        updateLevelIndicator();
    }

    function createGrid() {
        const areaWidth = window.innerWidth;
        const areaHeight = window.innerHeight - 160;

        const gridWidth = (getLevel().cols * SLOT_SIZE) + ((getLevel().cols - 1) * GAP);
        const gridHeight = (getLevel().rows * SLOT_SIZE) + ((getLevel().rows - 1) * GAP);

        const startX = (areaWidth - gridWidth) / 2;
        const startY = (areaHeight - gridHeight) / 2 + 40;

        for (let r = 0; r < getLevel().rows; r++) {
            for (let c = 0; c < getLevel().cols; c++) {
                const slot = document.createElement('div');
                slot.classList.add('grid-slot');
                slot.style.left = (startX + c * (SLOT_SIZE + GAP)) + 'px';
                slot.style.top = (startY + r * (SLOT_SIZE + GAP)) + 'px';

                const centerX = startX + c * (SLOT_SIZE + GAP) + SLOT_SIZE/2;
                const centerY = startY + r * (SLOT_SIZE + GAP) + SLOT_SIZE/2;

                // Сохраняем центральные точки ячеек
                centerPoints.push({ x: centerX, y: centerY, filled: false });

                // Создаём маркер центра (невидимый до проверки)
                const centerPoint = document.createElement('div');
                centerPoint.classList.add('center-point');
                centerPoint.style.left = centerX + 'px';
                centerPoint.style.top = centerY + 'px';
                gameArea.appendChild(centerPoint);

                gameArea.appendChild(slot);
                slots.push(slot);
            }
        }
    }

    function createFolders() {
        for (let i = 0; i < getLevel().folders; i++) {
            const folder = document.createElement('div');
            folder.classList.add('folder');
            folder.id = `folder-${i}`;

            folder.innerHTML = getFolderSVG();

            folder.addEventListener('mousedown', handleMouseDown);

            gameArea.appendChild(folder);
            folders.push(folder);
        }

        document.addEventListener('mousemove', handleMouseMove);
        document.addEventListener('mouseup', handleMouseUp);
    }

    function placeFoldersInGrid() {
        for (let i = 0; i < getLevel().folders; i++) {
            if (centerPoints[i]) {
                folders[i].style.left = centerPoints[i].x + 'px';
                folders[i].style.top = centerPoints[i].y + 'px';
                folders[i].style.position = 'absolute';
                folders[i].classList.add('locked');
            }
        }
    }

    function hideGrid() {
        slots.forEach(slot => slot.classList.add('hidden'));
    }

    function scrambleFolders() {
        const areaWidth = gameArea.offsetWidth;
        const areaHeight = gameArea.offsetHeight;
        const padding = 100;

        folders.forEach((folder, i) => {
            let newX, newY;
            do {
                newX = Math.random() * (areaWidth - padding * 2) + padding;
                newY = Math.random() * (areaHeight - padding * 2) + padding;
            } while (
                Math.abs(newX - centerPoints[i].x) < 250 &&
                Math.abs(newY - centerPoints[i].y) < 250
            );

            folder.style.left = newX + 'px';
            folder.style.top = newY + 'px';
            folder.classList.remove('locked');
        });
    }

    // --- СВОБОДНОЕ ПЕРЕТАСКИВАНИЕ ---

    function handleMouseDown(e) {
        if (this.classList.contains('locked')) return;

        isDragging = true;
        currentFolder = this;

        const rect = this.getBoundingClientRect();
        dragOffsetX = e.clientX - rect.left - rect.width / 2;
        dragOffsetY = e.clientY - rect.top - rect.height / 2;

        this.classList.add('dragging');

        e.preventDefault();
    }

    function handleMouseMove(e) {
        if (!isDragging || !currentFolder) return;

        const gameAreaRect = gameArea.getBoundingClientRect();

        let newX = e.clientX - gameAreaRect.left + dragOffsetX;
        let newY = e.clientY - gameAreaRect.top + dragOffsetY;

        const padding = 50;
        newX = Math.max(padding, Math.min(gameAreaRect.width - padding, newX));
        newY = Math.max(padding, Math.min(gameAreaRect.height - padding, newY));

        currentFolder.style.left = newX + 'px';
        currentFolder.style.top = newY + 'px';
    }

    function handleMouseUp(e) {
        if (!isDragging || !currentFolder) return;

        currentFolder.classList.remove('dragging');

        isDragging = false;
        currentFolder = null;
    }

    // --- Проверка результатов (ПО ЦЕНТРАЛЬНЫМ ТОЧКАМ) ---

    function checkResults() {
        checkBtn.style.display = 'none';

        folders.forEach(f => f.classList.add('locked'));

        // Показываем центральные точки
        document.querySelectorAll('.center-point').forEach(p => p.classList.add('visible'));

        let totalError = 0;
        let perfectMatches = 0;
        let errors = [];

        // Сбрасываем метки заполненности
        centerPoints.forEach(cp => cp.filled = false);

        // Для каждой папки ищем ближайшую свободную центральную точку
        folders.forEach((folder, folderIndex) => {
            const currentX = parseFloat(folder.style.left);
            const currentY = parseFloat(folder.style.top);

            // Находим ближайшую ещё не занятую центральную точку
            let bestMatch = null;
            let bestDistance = Infinity;

            centerPoints.forEach((cp, cpIndex) => {
                if (cp.filled) return;

                const distance = Math.sqrt(
                    Math.pow(currentX - cp.x, 2) +
                    Math.pow(currentY - cp.y, 2)
                );

                if (distance < bestDistance) {
                    bestDistance = distance;
                    bestMatch = cp;
                }
            });

            // Если нашли точку
            if (bestMatch) {
                bestMatch.filled = true;

                // Проверяем на идеальное совпадение
                const isPerfect = bestDistance <= PERFECT_THRESHOLD;
                if (isPerfect) perfectMatches++;

                // Считаем ошибку в процентах (0px = 100%, 200px+ = 0%)
                const accuracy = Math.max(0, 100 - (bestDistance / MAX_ERROR_DISTANCE * 100));
                totalError += accuracy;

                errors.push({
                    folder: folderIndex + 1,
                    distance: Math.round(bestDistance),
                    accuracy: accuracy.toFixed(1),
                    perfect: isPerfect
                });

                // Рисуем линию от центра к папке
                const line = document.createElement('div');
                line.classList.add('error-line');

                const angle = Math.atan2(currentY - bestMatch.y, currentX - bestMatch.x) * 180 / Math.PI;
                const lineLength = Math.min(bestDistance, 200);

                line.style.width = lineLength + 'px';
                line.style.left = bestMatch.x + 'px';
                line.style.top = bestMatch.y + 'px';
                line.style.transform = `rotate(${angle}deg)`;
                line.style.background = isPerfect ? '#4cd964' : '#ff3b30';
                line.style.opacity = '0.7';

                gameArea.appendChild(line);

                setTimeout(() => {
                    line.style.opacity = '1';
                }, 100 + folderIndex * 100);
            }
        });

        // Средняя точность
        const avgAccuracy = totalError / getLevel().folders;

        setTimeout(() => {
            showResults(avgAccuracy, errors, perfectMatches);
        }, 1000);
    }

    function showResults(accuracy, errors, perfectMatches) {
        document.getElementById('victory-screen').style.display = 'none';
        resultsEl.style.display = 'block';
        nextBtn.src = 'start.svg';
        nextBtn.style.display = 'block';

        const scoreCircle = document.getElementById('score-circle');
        const scoreValue = document.getElementById('score-value');

        let currentScore = 0;
        const interval = setInterval(() => {
            currentScore += 2;
            if (currentScore >= accuracy) {
                currentScore = accuracy;
                clearInterval(interval);
            }

            scoreValue.textContent = Math.round(currentScore) + '/100';
            scoreCircle.style.background = `conic-gradient(${getColorForScore(currentScore)} ${currentScore}%, #e5e5e5 ${currentScore}%)`;
        }, 20);

        const errorDetails = document.getElementById('error-details');
        errorDetails.innerHTML = `
            <p><strong>Папок:</strong> ${getLevel().folders}</p>
            <p><strong>Идеальных совпадений:</strong> ${perfectMatches} из ${getLevel().folders}</p>
            <hr style="border: none; border-top: 1px solid #ddd; margin: 15px 0;">
            <p><strong>Детально по папкам:</strong></p>
            ${errors.map(e => `
                <p style="color: ${e.perfect ? '#4cd964' : '#ff3b30'}">
                    Папка ${e.folder}: отклонение ${e.distance}px (${e.accuracy}%)
                    ${e.perfect ? ' ✓' : ''}
                </p>
            `).join('')}
        `;
    }

    function getColorForScore(score) {
        if (score >= 80) return '#4cd964';
        if (score >= 50) return '#ffcc00';
        return '#ff3b30';
    }
